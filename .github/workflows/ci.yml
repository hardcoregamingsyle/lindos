# Lindos CI (SPEC §1 / §12, SPEC-VM §25)
#
#   lint-test   every push / PR: tests/run.sh (bash -n, sh -n, py_compile,
#               shellcheck, JSON/XML/.desktop, CRLF, pytest, compat-doc check)
#               on Ubuntu 24.04 (noble = the Lindos base) and — for the
#               "importable on any OS" rule of SPEC §4 — a pytest-only run on
#               Windows.
#   debs        every push / PR: build/mkdeb.sh all (+ lintian) and upload
#               out/debs/*.deb as an artifact.  mkdeb.sh 'all' auto-discovers
#               every packages/<name>/ with a DEBIAN/control, so the SPEC-VM
#               packages lindos-vm and lindos-winapps are built the moment they
#               exist — no change to this job is needed for them.
#   publish-repo  workflow_dispatch only (SPEC-UPDATE.md §36.5-§36.6): builds the
#               flat-format signed apt repo (build/publish-apt-repo.sh) from the
#               'debs' job's .deb artifact (+ the kernel's, if that job also ran),
#               uploads out/apt-repo/** always, and additionally deploys it to
#               GitHub Pages only when the repo variable LINDOS_PAGES_ENABLED is
#               'true' (unset by default — never enabled by CI on its own).
#   kernel      workflow_dispatch input build_kernel, and on tags (SPEC-VM §25):
#               the real Linux work this Windows dev host cannot do — compile
#               the Lindos-tuned kernel .debs on the Ubuntu runner.  Slow and
#               optional; caches the source tree; uploads linux-image/-headers.
#   iso         workflow_dispatch only (needs ~15 GB and a Mint base ISO):
#               build/build-iso.sh in the privileged builder container.  It
#               optionally downloads the 'kernel' artifact into out/kernel/
#               first so 35-kernel.sh installs the Lindos kernel; the ISO still
#               builds if no kernel artifact is present.
#   boot-test   workflow_dispatch only (needs the 'iso' job): boots the ISO's LIVE session under
#               QEMU/KVM (build/qa/boot_test.py) and judges it from the serial log: the smoke
#               test's CLI checks plus the live-session checks (no first-run wizard, the "Install
#               Lindos" launcher, panel/desktop, no sleep, nothing installing) and a screenshot
#               that must not be blank.  A second step checks the BOOT MENUS of the finished ISO
#               structurally (build/qa/menu_checks.py: grub.cfg/loopback.cfg entries, default and
#               script syntax, the isolinux labels generated from them, the boot catalogue).
#   install-test  workflow_dispatch only, opt-in (install_test=true; needs the 'iso' job): the
#               only real test of the installer.  build/qa/install_test.py installs the ISO onto a
#               blank virtual disk (Ubiquity's automatic mode, a CI-only preseed, real network),
#               asserts the default 'Install Lindos' session is only the installer, asserts the
#               installed disk read-only (install-state.json, oem-config armed, no leftovers, dpkg
#               clean, Chrome vs marker, every 'done' step's packages, the baked seed's effects),
#               then boots the INSTALLED disk and expects Ubiquity's oem-config wizard.  Nothing
#               depends on it and it never fails the run (continue-on-error): it exists to hand
#               the maintainers a reproducible install log.
#   install-test-offline  workflow_dispatch only, opt-in (install_test_offline=true): the same
#               install on a guest WITHOUT a network device - proves the hook's offline path (every
#               step 'pending', oem-config still armed).  Independent runner, never fails the run.
#   menu-test   workflow_dispatch only (needs the 'iso' job, on by default, never fails the run):
#               boots the ISO through its OWN boot loaders (build/qa/menu_test.py: SeaBIOS +
#               ISOLINUX, then OVMF + GRUB) and requires the default entry to reach casper.
#
# The Windows pytest job globs packages/*/tests, so lindos-vm/tests and
# lindos-winapps/tests (SPEC-VM §26) run on both Ubuntu (via tests/run.sh) and
# Windows automatically once those packages land — no change needed here.
name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Also build the ISO (slow; downloads the Mint base ISO)"
        type: boolean
        default: false
      build_kernel:
        description: "Also build the Lindos-tuned kernel .debs (very slow)"
        type: boolean
        default: false
      include_wine:
        description: "INCLUDE_WINE (1 = WineHQ stack on the ISO)"
        type: string
        default: "1"
      include_steam:
        description: "INCLUDE_STEAM (1 = Steam/Lutris/Heroic on the ISO)"
        type: string
        default: "1"
      boot_test:
        description: "Boot-test the built ISO under QEMU/KVM (needs build_iso)"
        type: boolean
        default: true
      install_test:
        description: "Install-test the built ISO onto a blank disk under QEMU/KVM with real network, then boot the installed disk (needs build_iso; slow, ~1-2 h; never fails the run)"
        type: boolean
        default: false
      install_test_offline:
        description: "Also run the install test on a guest with NO network device (proves the hook's offline path; needs build_iso; never fails the run)"
        type: boolean
        default: false
      menu_test:
        description: "Boot the built ISO through its own boot loaders (SeaBIOS/ISOLINUX and OVMF/GRUB) under QEMU/KVM (needs build_iso; never fails the run)"
        type: boolean
        default: true
      install_budget:
        description: "install_test: wall-clock budget of the installer hook in seconds (kernel word lindos.install_budget)"
        type: string
        default: "2400"
      install_firmware:
        description: "install_test: guest firmware (uefi is supported but not yet proven)"
        type: choice
        options:
          - bios
          - uefi
        default: bios

permissions:
  contents: read

env:
  NO_COLOR: "1"
  PYTHONUTF8: "1"

jobs:
  lint-test:
    name: lint + pytest (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck desktop-file-utils python3 python3-pytest dash grub-common

      - name: tests/run.sh
        run: bash tests/run.sh --verbose

      - name: docs/COMPATIBILITY.md is generated from compat-matrix.json
        run: python3 tests/gen-compat-doc.py --check

  pytest-windows:
    name: pytest (Windows, gi stub)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: pytest
        shell: bash
        run: |
          python -m pytest -q -c tests/pytest.ini --rootdir . -p lindos_testsupport \
            tests packages/*/tests build/tests

  debs:
    name: build .deb packages
    runs-on: ubuntu-24.04
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg-dev + lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev lintian fakeroot

      - name: build/mkdeb.sh all
        run: bash build/mkdeb.sh --lintian all

      - name: List results
        run: ls -l out/debs/

      - uses: actions/upload-artifact@v4
        with:
          name: lindos-debs
          path: out/debs/*.deb
          if-no-files-found: error
          retention-days: 14

  publish-repo:
    name: publish Lindos apt repo (manual)
    # manual only: this never runs on a plain push/PR, and it never deploys anything on its
    # own (see the Pages steps below) -- SPEC-UPDATE.md §35/§36.6.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    needs: debs
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download lindos-debs artifact
        uses: actions/download-artifact@v4
        with:
          name: lindos-debs
          path: out/debs

      # Optional: the tuned kernel's .debs, when the 'kernel' job also produced an artifact
      # in this same workflow run. Harmless (the kernel is simply left out of the repo) when
      # it did not -- build/publish-apt-repo.sh's --kernel-in is best-effort by design.
      - name: Download lindos-kernel-debs artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lindos-kernel-debs
          path: out/kernel

      - name: Install apt-ftparchive + gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: build/publish-apt-repo.sh
        run: |
          # No persistent signing key is configured for this repository yet
          # (SPEC-UPDATE.md §35/§36.5) -- '--gen-key' produces an honestly-labelled
          # ephemeral CI key (README-CI-KEY.txt) instead of silently failing or
          # shipping something unsigned. Wiring in a real, persistent key later is
          # a matter of importing it into $GNUPGHOME in an earlier step (e.g. from
          # a repository secret) and passing --key-id instead of --gen-key here.
          bash build/publish-apt-repo.sh --in out/debs --kernel-in out/kernel --out out/apt-repo --gen-key

      - name: List repository contents
        run: ls -l out/apt-repo/

      - uses: actions/upload-artifact@v4
        with:
          name: lindos-apt-repo
          path: out/apt-repo/**
          if-no-files-found: error
          retention-days: 14

      # GitHub Pages deployment is a one-time, explicit choice for whoever owns this
      # repository (documented in docs/UPDATES.md), never something CI enables by itself:
      # every step below is a no-op unless the repository variable LINDOS_PAGES_ENABLED is
      # set to 'true' (it is unset by default).
      - name: Configure Pages
        if: ${{ vars.LINDOS_PAGES_ENABLED == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ vars.LINDOS_PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/apt-repo

      - name: Deploy to GitHub Pages
        if: ${{ vars.LINDOS_PAGES_ENABLED == 'true' }}
        uses: actions/deploy-pages@v4

  kernel:
    name: build Lindos kernel (manual / tags)
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.build_kernel)
          || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    needs: lint-test
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dpkg-dev build-essential \
            libncurses-dev rsync cpio kmod xz-utils dwarves debhelper libdw-dev

      - name: Resolve kernel version from the manifest
        id: ver
        run: |
          v="$(python3 -c 'import json;print(json.load(open("packages/lindos-kernel/root/usr/share/lindos/kernel/manifest.json",encoding="utf-8"))["recommended"]["series"])')"
          echo "series=${v}" >> "$GITHUB_OUTPUT"
          echo "Lindos kernel series: ${v}"

      - name: Cache kernel source tree
        uses: actions/cache@v4
        with:
          path: out/kernel-src
          key: kernel-src-${{ steps.ver.outputs.series }}-${{ hashFiles('packages/lindos-kernel/root/usr/share/lindos/kernel/lindos.config') }}
          restore-keys: |
            kernel-src-${{ steps.ver.outputs.series }}-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: build/kernel/build-kernel.sh
        run: |
          bash build/kernel/build-kernel.sh \
            --version "${{ steps.ver.outputs.series }}" \
            --jobs "$(nproc)" \
            --base-config ubuntu

      - name: List kernel artifacts
        run: ls -l out/kernel/

      - uses: actions/upload-artifact@v4
        with:
          name: lindos-kernel-debs
          # `make bindeb-pkg` also produces linux-image-<ver>-dbg_*.deb (debug symbols --
          # 1.3+ GB for 6.14.0-lindos, vs ~47 MB for the real image / ~10 MB for headers),
          # which the linux-image-*.deb pattern above also matches. Excluded: it made
          # `gh run download -n lindos-kernel-debs` take 20+ minutes for nothing, and (see
          # build/chroot/35-kernel.sh's own matching fix) it must never be `dpkg -i`'d into
          # the ISO either.
          path: |
            out/kernel/linux-image-*.deb
            out/kernel/linux-headers-*.deb
            !out/kernel/linux-image-*-dbg_*.deb
          if-no-files-found: error
          retention-days: 14

  iso:
    name: build ISO (manual)
    # always() so a skipped 'kernel' dependency does not skip the ISO; the ISO
    # still builds without a Lindos kernel (35-kernel.sh falls back to stock).
    if: >-
      ${{ always()
          && needs.debs.result == 'success'
          && github.event_name == 'workflow_dispatch'
          && inputs.build_iso }}
    runs-on: ubuntu-24.04
    needs: [debs, kernel]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      # Optional: pull the kernel .debs built by the 'kernel' job (same run)
      # into out/kernel/ so 35-kernel.sh installs the Lindos kernel.  If the
      # kernel job did not run (build_kernel not requested) this download fails
      # harmlessly and the ISO is built with the stock Mint/Ubuntu kernel.
      - name: Download Lindos kernel artifact (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lindos-kernel-debs
          path: out/kernel

      - name: Stage kernel .debs into the chroot deb pool
        run: |
          # build-iso.sh stages out/debs/ into the chroot (/tmp/lindos/debs);
          # it does not stage out/kernel/.  35-kernel.sh scans that same deb
          # pool, so copy the downloaded kernel .debs into out/debs/ where they
          # will be picked up and installed (grub is regenerated to default to
          # the Lindos kernel).  No-op — and stock kernel — if none were built.
          if ls out/kernel/*.deb >/dev/null 2>&1; then
            mkdir -p out/debs
            cp -f out/kernel/*.deb out/debs/
            echo "Lindos kernel .debs staged into out/debs/ — 35-kernel.sh will install them:"
            ls -l out/kernel/
          else
            echo "No Lindos kernel artifact — ISO will use the stock kernel."
          fi

      - name: Build the ISO in the builder container
        env:
          INCLUDE_WINE: ${{ inputs.include_wine }}
          INCLUDE_STEAM: ${{ inputs.include_steam }}
        run: |
          # docker-build.sh builds build/Dockerfile and runs build-iso.sh
          # (which itself runs mkdeb.sh and fetch-assets.sh) with --privileged.
          bash build/docker-build.sh -- --no-cleanup

      - name: Checksums
        run: ls -l out/*.iso out/*.sha256 && cat out/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: lindos-iso
          path: |
            out/*.iso
            out/*.sha256
            out/build.log
          if-no-files-found: error
          retention-days: 7

  boot-test:
    name: boot-test the ISO (QEMU/KVM)
    # Actually boots the built ISO — CONTINUATION.md item 2/6: "nothing here has ever been
    # booted yet". Runs the live kernel/initrd directly under QEMU (bypassing GRUB), with the
    # ISO attached as a virtual CD-ROM so casper finds the squashfs exactly as on real hardware.
    # The `lindos.ci_boot_test` kernel-command-line flag triggers lindos-ci-boot-smoke-test.service
    # (packages/lindos-core/.../usr/lib/systemd/system/), which runs
    # packages/lindos-core/.../usr/libexec/lindos/qa/ci-boot-smoke-test.sh alongside the normal
    # boot, ordered only against basic.target (see build/qa/boot_test.py's docstring) — it never
    # delays or replaces the real desktop, and never waits on multi-user.target/graphical.target
    # either. GitHub's ubuntu-24.04 hosted runners have nested KVM; boot_test.py falls back to
    # TCG automatically (slower, but never hard-fails just because /dev/kvm is absent).
    # The live session no longer runs the first-run wizard (it is only the installer), so the
    # screenshot of the desktop is judged by guest-side checks (packages/lindos-core/.../qa/
    # ci-live-checks.sh: no wizard, the "Install Lindos" launcher, panel/desktop, no sleep) and
    # must not be blank; the wizard is no longer what proves a working desktop.
    if: >-
      ${{ always()
          && needs.iso.result == 'success'
          && github.event_name == 'workflow_dispatch'
          && inputs.build_iso
          && inputs.boot_test }}
    runs-on: ubuntu-24.04
    needs: iso
    # Was 40: run 36313769193 found that once the guest actually resolves graphical.target for
    # real (lightdm/Xorg genuinely starting, plus NetworkManager/wpa_supplicant/udisks2/
    # gpu-manager/ubiquity/... all now legitimately running instead of never being reached),
    # LINDOS_SMOKE_DONE did not arrive within the old 600s --timeout at all under this job's
    # only 2 vCPUs (30+ concurrent unit starts competing for 2 cores). Bumped --timeout to 1500s
    # and --cpus to 4 (matching this runner's real core count, cutting real contention instead
    # of just waiting longer) -- worst case (1500s smoke wait + 180s desktop-wait + 90s grace +
    # ~1min screenshot/upload) is ~30 min, plus ~5 min setup/checkout/artifact-download, so 55m
    # keeps real headroom without being unbounded.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + xorriso + Pillow + grub-script-check
        run: |
          sudo apt-get update
          # grub-common: grub-script-check, used by the boot menu checks below
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso grub-common
          python3 -m pip install --quiet --user pillow

      - name: Check for KVM
        run: |
          if [ -e /dev/kvm ]; then
            ls -la /dev/kvm
            # The device node exists (nested virt is on) but the 'runner' user's membership in
            # the 'kvm' group, added by udev when the node was created, doesn't apply to this
            # already-running shell/job (group membership is only re-read on a fresh login) --
            # this is the well-known GitHub-hosted-runner KVM gotcha, not anything Lindos-side.
            # boot_test.py already falls back to TCG on 'Permission denied' rather than hard-
            # failing, but TCG's software CPU emulation has real correctness gaps in 32-bit
            # WoW64 LDT/segment handling that real KVM does not (see CI-LOGS.md) -- so make the
            # existing device actually usable on this ephemeral, single-job runner instead of
            # silently eating the slower + less accurate fallback.
            sudo chmod 0666 /dev/kvm
            ls -la /dev/kvm
            echo "KVM available — boot test will be fast and accurate."
          else
            echo "::warning::no /dev/kvm on this runner — falling back to TCG (much slower); see build/qa/boot_test.py"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: lindos-iso
          path: out

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Boot the ISO and run the smoke test
        id: boot
        run: |
          extra=()
          if [ "${{ inputs.build_kernel }}" = "true" ]; then
            # Must be the --opt=value form: argparse treats a following token that starts with
            # '-' as looking like another option, not this one's value, and refuses to consume
            # it ("expected one argument") -- seen for real in CI the first time build_kernel=true
            # and boot_test=true ever ran together (this flag was never exercised before that).
            extra+=(--require-kernel-suffix=-lindos)
          fi
          python3 build/qa/boot_test.py --iso 'out/lindos-*.iso' --out-dir out/qemu-boot-test \
            --timeout 1500 --grace 90 --cpus 4 "${extra[@]}"

      # The boot test starts the kernel directly, so it never runs the ISO's boot MENUS.  This reads them off the finished
      # ISO with xorriso and checks their structure (a GRUB script error, a wrongly rewritten isolinux/live.cfg, a
      # missing kernel, a lost OEM word, a default that boots nothing); build/qa/menu_test.py (job menu-test) boots them.
      # if: always() - a red boot test must not hide a broken menu, nor the other way round.
      - name: Check the boot menus of the ISO (GRUB, ISOLINUX, boot catalogue)
        if: always()
        continue-on-error: true   # first real runs: report, do not gate, until the checks have met a real ISO
        run: |
          set -o pipefail
          python3 build/qa/menu_checks.py --iso 'out/lindos-*.iso' --work-dir out/menu-checks | tee out/menu-checks.txt

      - name: Upload boot-test artifacts (serial log + screenshot + menu checks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lindos-boot-test
          path: |
            out/qemu-boot-test/serial.log
            out/qemu-boot-test/desktop.png
            out/qemu-boot-test/desktop.ppm
            out/menu-checks.txt
            out/menu-checks/*.cfg
          if-no-files-found: warn
          retention-days: 14

  install-test:
    name: install-test the ISO (QEMU/KVM, real network)
    # The only real test of the installer flow (Ubiquity OEM mode + the lindos-installer target-config
    # hook + finalize.sh + the oem-config first boot): nothing else can run an installation - not the
    # Windows dev host, not the unit tests.  Opt-in (install_test=true) because it is slow and needs
    # the internet: the hook downloads updates, Chrome, Wine, launchers and Flatpaks for real.
    #
    #   * build/qa/install_test.py boots the ISO's own kernel/initrd DIRECTLY (like boot-test) with the
    #     words of the shipped "Install Lindos" boot entry + automatic-ubiquity.  The CI-only preseed
    #     reaches Ubiquity as /preseed.cfg in a small cpio archive prepended to the ISO's initrd (casper
    #     loads it), so the medium is not modified and no second device is needed.
    #   * user-mode networking, so the network steps really run; a blank sparse 32 GB virtio disk.
    #   * afterwards the disk is loop-mounted READ-ONLY and asserted (build/qa/install_checks.py), then
    #     the installed disk is booted and must show Ubiquity's oem-config wizard.
    #   * everything the maintainers need lands in the artifact: both serial logs, progress and
    #     first-boot screenshots, the installer's own logs copied off the installed disk (the CI
    #     password scrubbed), summary.md / report.json.
    #
    # Ubiquity's automatic mode is lightly maintained: expect the first rounds to fail on a page the
    # preseed does not answer.  That is what this job is for; the artifact shows where.  Hence
    # continue-on-error (a red job here must not hide the ISO/boot-test results of the same run) -
    # remove it once the job has passed a few times.  Nothing lists this job in 'needs'.
    if: >-
      ${{ always()
          && needs.iso.result == 'success'
          && github.event_name == 'workflow_dispatch'
          && inputs.build_iso
          && inputs.install_test }}
    runs-on: ubuntu-24.04
    needs: iso
    continue-on-error: true
    # 90 min install + 15 min first boot + ~15 min setup/upload; the install itself normally takes 20-60.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + xorriso + Pillow + OVMF + grub-script-check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso python3-pil ovmf grub-common

      - name: Check for KVM
        run: |
          # An install under TCG (software emulation) takes hours; install_test.py refuses to start
          # without a usable /dev/kvm.  The device node is there on GitHub's hosted runners, but the
          # 'runner' user is not (yet) in the kvm group in this already-running job.
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            ls -la /dev/kvm
            echo "KVM available."
          else
            echo "::warning::no /dev/kvm on this runner - install_test.py will refuse to run under TCG"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: lindos-iso
          path: out

      - name: Free disk space
        run: |
          # the ISO (3.6 GB) + the installed disk (up to ~18 GB written) need real room
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install Lindos onto a blank disk, then boot it
        id: install
        env:
          INSTALL_BUDGET: ${{ inputs.install_budget }}
          INSTALL_FIRMWARE: ${{ inputs.install_firmware }}
        run: |
          extra=()
          if [ "${{ inputs.build_kernel }}" = "true" ]; then
            # --opt=value form, see the boot-test step (argparse and a value starting with '-')
            extra+=(--require-kernel-suffix=-lindos)
          fi
          # root is needed for the loop mounts; the whole script runs under sudo (the harness itself
          # uses sudo -n when it is not root)
          sudo env "PATH=$PATH" PYTHONUTF8=1 python3 build/qa/install_test.py --iso 'out/lindos-*.iso' \
            --out-dir out/qemu-install-test --cpus 4 \
            --install-budget "${INSTALL_BUDGET:-2400}" --firmware "${INSTALL_FIRMWARE:-bios}" "${extra[@]}"

      - name: Job summary
        if: always()
        run: |
          if [ -f out/qemu-install-test/summary.md ]; then
            cat out/qemu-install-test/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "install_test.py wrote no summary.md (it stopped before the report)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload install-test artifacts (logs + screenshots + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lindos-install-test
          # never the disk image or the kernel/initrd copies (work/): gigabytes, and nothing to read in them
          path: |
            out/qemu-install-test/summary.md
            out/qemu-install-test/report.json
            out/qemu-install-test/serial-install.log
            out/qemu-install-test/serial-first-boot.log
            out/qemu-install-test/install-cmdline.txt
            out/qemu-install-test/preseed.redacted.seed
            out/qemu-install-test/*.png
            out/qemu-install-test/*.ppm
            out/qemu-install-test/installed-logs/**
            out/qemu-install-test/work/grub.cfg
            out/qemu-install-test/work/menus/*.cfg
          if-no-files-found: warn
          retention-days: 14

  install-test-offline:
    name: install-test the ISO with NO network (QEMU/KVM)
    # The offline path of the installer hook, which the online install-test cannot reach: the guest has no network
    # device at all, so the hook must record online=false and every step 'pending' (the silent retries and Settings do
    # them later), and the machine must still arm oem-config.  The asserts are the same as the online run's, plus
    # install_checks' strict_offline ones; nothing is downloaded, so it is much faster (no first boot: --skip-phase3).
    # Opt-in like the online job, an independent runner, never fails the run.
    if: >-
      ${{ always()
          && needs.iso.result == 'success'
          && github.event_name == 'workflow_dispatch'
          && inputs.build_iso
          && inputs.install_test_offline }}
    runs-on: ubuntu-24.04
    needs: iso
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + xorriso + Pillow + grub-script-check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso python3-pil grub-common

      - name: Check for KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            ls -la /dev/kvm
            echo "KVM available."
          else
            echo "::warning::no /dev/kvm on this runner - install_test.py will refuse to run under TCG"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: lindos-iso
          path: out

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install Lindos onto a blank disk without a network
        id: install
        env:
          INSTALL_BUDGET: ${{ inputs.install_budget }}
        run: |
          extra=()
          if [ "${{ inputs.build_kernel }}" = "true" ]; then
            extra+=(--require-kernel-suffix=-lindos)
          fi
          sudo env "PATH=$PATH" PYTHONUTF8=1 python3 build/qa/install_test.py --iso 'out/lindos-*.iso' \
            --out-dir out/qemu-install-test-offline --cpus 4 --network off --skip-phase3 \
            --install-budget "${INSTALL_BUDGET:-2400}" "${extra[@]}"

      - name: Job summary
        if: always()
        run: |
          if [ -f out/qemu-install-test-offline/summary.md ]; then
            cat out/qemu-install-test-offline/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "install_test.py wrote no summary.md (it stopped before the report)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload offline install-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lindos-install-test-offline
          path: |
            out/qemu-install-test-offline/summary.md
            out/qemu-install-test-offline/report.json
            out/qemu-install-test-offline/serial-install.log
            out/qemu-install-test-offline/install-cmdline.txt
            out/qemu-install-test-offline/preseed.redacted.seed
            out/qemu-install-test-offline/*.png
            out/qemu-install-test-offline/*.ppm
            out/qemu-install-test-offline/installed-logs/**
            out/qemu-install-test-offline/work/grub.cfg
            out/qemu-install-test-offline/work/menus/*.cfg
          if-no-files-found: warn
          retention-days: 14

  menu-test:
    name: boot the ISO through its own boot loaders (QEMU/KVM)
    # build/qa/boot_test.py and install_test.py start the kernel directly, so nothing else ever runs the shipped boot
    # menus.  This boots the ISO like a machine does - ONLY the CD-ROM, first through SeaBIOS (ISOLINUX menu), then through
    # OVMF (GRUB menu) - and lets each menu's own timeout start the default entry ('Install Lindos').  It passes when the
    # boot loader drew a screen and the guest read enough of the medium to have reached casper (kernel + initrd + root
    # file system); it cannot see what the session runs (the install test judges that).  Never proven before: the first
    # rounds may need their thresholds tuned, so it never fails the run (continue-on-error) - the screenshots say why.
    if: >-
      ${{ always()
          && needs.iso.result == 'success'
          && github.event_name == 'workflow_dispatch'
          && inputs.build_iso
          && inputs.menu_test }}
    runs-on: ubuntu-24.04
    needs: iso
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + xorriso + Pillow + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso python3-pil ovmf

      - name: Check for KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
            ls -la /dev/kvm
            echo "KVM available."
          else
            echo "::warning::no /dev/kvm on this runner - menu_test.py will refuse to run under TCG"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: lindos-iso
          path: out

      - name: Boot the ISO through SeaBIOS and ISOLINUX
        run: python3 build/qa/menu_test.py --iso 'out/lindos-*.iso' --out-dir out/qemu-menu-test --firmware bios

      - name: Boot the ISO through OVMF and GRUB (UEFI; not proven yet)
        if: always()
        run: python3 build/qa/menu_test.py --iso 'out/lindos-*.iso' --out-dir out/qemu-menu-test --firmware uefi

      - name: Job summary
        if: always()
        run: |
          for f in out/qemu-menu-test/report-*.txt; do
            [ -f "$f" ] || continue
            { echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload menu-test artifacts (reports + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lindos-menu-test
          # never the OVMF variable stores or the monitor sockets
          path: |
            out/qemu-menu-test/report-*.txt
            out/qemu-menu-test/serial-*.log
            out/qemu-menu-test/bios/*
            out/qemu-menu-test/uefi/*
          if-no-files-found: warn
          retention-days: 14
