# /usr/lib/binfmt.d/lindos-pe.conf - lindos-compat (SPEC-WINDOWS §28.7)
#
# Lets a terminal start Windows programs directly ("./setup.exe"): the kernel hands every
# executable file that starts with "MZ" to /usr/libexec/lindos/lindos-binfmt, which re-checks
# the file (DLLs, drivers and EFI files are refused) and opens it with lindos-run - Wine or
# Proton, the program's own C:\ drive.  No flags: the wrapper gets the path as execve() saw it.
#
# Registered at boot by systemd-binfmt.service, at install time by the package with
#   /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/lindos-pe.conf
# Turn it off (persistently): lindos-compat binfmt disable   (masks this file with
#   /etc/binfmt.d/lindos-pe.conf -> /dev/null); on again: lindos-compat binfmt enable.
:lindos-pe:M::MZ::/usr/libexec/lindos/lindos-binfmt:
