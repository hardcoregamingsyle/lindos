### /etc/xdg/MangoHud/MangoHud.conf — Lindos default MangoHud overlay (lindos-gaming)
###
### MangoHud reads ~/.config/MangoHud/MangoHud.conf (or the file named by
### $MANGOHUD_CONFIGFILE) — Lindos seeds that per-user file from this template
### with `lindos-mangohud sync` (run by Lindos Settings → Gaming and the mode
### switch).  Keys: https://github.com/flightlessmango/MangoHud#hud-configuration
###
### Toggle the HUD in-game with Right-Shift + F12.  Start a game with the
### overlay:  mangohud %command%   (Steam)   ·   lindos-run --mangohud game.exe

################ VISUAL #################
### Legacy layout, top-left corner, semi-transparent rounded background
legacy_layout=1
position=top-left
font_size=20
background_alpha=0.4
round_corners=8
alpha=1.0
### Lindos accent for the text values (dark accent #60CDFF), white labels
text_color=FFFFFF
gpu_color=60CDFF
cpu_color=60CDFF
engine_color=60CDFF
frametime_color=60CDFF
media_player_color=FFFFFF
background_color=202020

################ HUD ####################
### Toggle keys — Right Shift + F12 shows/hides, Shift_L+F2 starts a benchmark log
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

### The HUD starts HIDDEN.  `lindos-mangohud on` (or the "MangoHud" toggle in
### Lindos Settings → Gaming, config key "mangohud") writes the per-user copy
### without this line so the overlay is visible from the start; the hotkey
### above always works either way.
no_display

################ PERFORMANCE ############
### frame rate + frame time
fps
fps_limit=0
frametime
frame_timing

### CPU: load %, temperature (needs lm-sensors / hwmon), core clocks off to stay compact
cpu_stats
cpu_temp
cpu_mhz=0

### GPU: load %, temperature, VRAM used, core clock, power draw
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram

### System RAM
ram

### Show the graphics API + Wine/Proton version, helps bug reports
engine_version
wine
vulkan_driver

################ MISC ###################
### Benchmark logs (Shift_L+F2) run for 60 s and are never started automatically
log_duration=60
autostart_log=0
### 500 ms sampling keeps CPU cost of the overlay negligible
fps_sampling_period=500
### Show the HUD only in the game window (not in launchers) is a per-app choice;
### blacklist common launchers so they never render the overlay:
blacklist=steam,steamwebhelper,lutris,heroic,bottles,wine-preloader,winecfg,explorer.exe,wineboot.exe,services.exe,rpcss.exe,svchost.exe,winedevice.exe,plugplay.exe,tabtip.exe,rundll32.exe,PrismLauncher,prismlauncher,sober,vinegar
