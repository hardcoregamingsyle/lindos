# 80-lindos-gaming.conf — kernel tunables for games (Lindos, lindos-gaming)
#
# Always on: harmless for desktop use, required by a growing number of Windows
# games run through Proton/Wine (and the SteamOS / Steam Deck default).
#
# Applied by: sysctl --system (at boot, and by the lindos-gaming postinst).
# The Gaming mode drop-in (/etc/sysctl.d/90-lindos-mode.conf, written by
# lindos-tune) may set the same key again with the same value; later file wins.

# Maximum number of memory-map areas a process may own.  Modern engines
# (Unreal, Unity, DXVK/vkd3d shader caches, Star Citizen, Hogwarts Legacy,
# Counter-Strike 2, DayZ …) exceed the kernel default of 65530 and crash or
# stutter.  Value used by SteamOS.
vm.max_map_count = 2147483642
