; /etc/gamemode.ini — Feral GameMode configuration shipped by Lindos (lindos-gaming).
;
; Applies when a game requests Game Mode: Steam (launch option
; "gamemoderun %command%"), Lutris/Heroic (Game Mode toggle), lindos-run
; (--gamemode or config gamemode_auto for games).  A per-user override lives in
; ~/.config/gamemode.ini and takes precedence over this file.
;
; Reference: https://github.com/FeralInteractive/gamemode/blob/master/example/gamemode.ini

[general]
; The reaper thread checks every N seconds whether the client that requested
; Game Mode is still alive.
reaper_freq=5

; CPU governor while a game runs / when it ends.  Set to the value expected on
; Lindos: schedutil at rest, performance while gaming.  Ignored gracefully on
; kernels/CPUs that do not offer the governor (e.g. intel_pstate active mode
; only offers performance/powersave).
desiredgov=performance
defaultgov=schedutil

; Integrated-GPU aware governor: when the iGPU is the render device and drawing
; a lot of power the CPU governor is left on powersave so the GPU gets the
; power budget (mainly laptops / handhelds).
igpu_desiredgov=powersave
igpu_power_threshold=0.3

; Priority tweaks for the game process (needs the user to be in the
; "gamemode" group or a matching /etc/security/limits.d rule; gamemoded warns
; and continues when it cannot renice).
softrealtime=auto
renice=10
ioprio=0

; Do not let the screensaver / DPMS interrupt a controller-only session.
inhibit_screensaver=1

; Optional: disable the split-lock mitigation (Linux 5.19+) that tanks the
; performance of some Windows games run through Wine/Proton.  Requires root
; helper support in gamemode >= 1.8; harmless when unsupported.
disable_splitlock=1

[filter]
; whitelist / blacklist of client names.  Empty = everything may request Game
; Mode.  Uncomment to keep launchers themselves out of Game Mode:
;blacklist=steam
;blacklist=lutris

[gpu]
; GPU overclocking is left OFF on purpose — Lindos does not touch clocks or
; power limits automatically.  Use CoreCtrl (AMD) or nvidia-settings for that.
apply_gpu_optimisations=0
gpu_device=0
;amd_performance_level=high
;nv_powermizer_mode=1

[cpu]
; Core parking / pinning is left to the kernel scheduler.
;park_cores=no
;pin_cores=no

[supervisor]
; Only allow the same user (and root) to request Game Mode on behalf of another
; process; leave empty to allow any supervisor.
;supervisor_whitelist=
;supervisor_blacklist=
;require_supervisor=0

[custom]
; Scripts run as the *user* when the first game enters / the last game leaves
; Game Mode.  Lindos pauses the picom compositor for lower latency and restores
; it afterwards (both honour the Lindos mode: nothing to stop in Lite mode).
start=/usr/libexec/lindos/gamemode-start.sh
end=/usr/libexec/lindos/gamemode-end.sh
; Timeout in seconds for the scripts above.
script_timeout=10
