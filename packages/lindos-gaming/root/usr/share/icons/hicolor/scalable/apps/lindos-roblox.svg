<?xml version="1.0" encoding="UTF-8"?>
<!--
  lindos-roblox.svg — original Lindos glyph for the "Roblox (via Sober)" launcher entry.
  A tilted rounded cube outline with a small square window; deliberately NOT the
  Roblox trademark.  Licence: GPL-3.0-or-later (Lindos Team).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60CDFF"/>
      <stop offset="1" stop-color="#0067C0"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>
  <!-- tilted cube outline -->
  <g transform="rotate(-14 32 32)">
    <rect x="16" y="16" width="32" height="32" rx="6" ry="6" fill="none" stroke="url(#cube)" stroke-width="5"/>
    <!-- inner window -->
    <rect x="27" y="27" width="10" height="10" rx="2" ry="2" fill="url(#cube)"/>
  </g>
</svg>
