<?xml version="1.0" encoding="UTF-8"?>
<!--
  lindos-minecraft.svg — original Lindos glyph for the "Minecraft (Prism Launcher)"
  launcher entry: an isometric block built from three flat faces in green/brown
  tones.  Deliberately NOT the Minecraft trademark or the grass-block texture.
  Licence: GPL-3.0-or-later (Lindos Team).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>
  <!-- isometric block: top, left, right faces -->
  <polygon points="32,12 50,22 32,32 14,22" fill="#7CC04B"/>
  <polygon points="14,22 32,32 32,52 14,42" fill="#8B5E3C"/>
  <polygon points="50,22 32,32 32,52 50,42" fill="#6E4A2E"/>
  <!-- soft highlight edge -->
  <polyline points="14,22 32,12 50,22" fill="none" stroke="#A6E36F" stroke-width="2" stroke-linejoin="round"/>
  <!-- accent dot (Lindos accent) -->
  <circle cx="32" cy="22" r="3" fill="#60CDFF"/>
</svg>
