# 50-lindos.cfg — Lindos conservative kernel cmdline drop-in (SPEC-KERNEL §15.3).
#
# Sourced by update-grub through /etc/default/grub.d/.  It appends only safe,
# reversible flags to GRUB_CMDLINE_LINUX_DEFAULT.  The region between the two
# markers below is rewritten idempotently by `lindos-kernel cmdline` (grub.py):
# edit freely OUTSIDE the markers; anything you put INSIDE them is overwritten.
#
# It deliberately does NOT set `mitigations=off` — that is a security trade-off,
# off by default.  Gaming mode can opt in with:
#     lindos-kernel cmdline --preset gaming        (documented in docs/KERNEL.md)
# which adds exactly this line inside the managed region:
#     GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT mitigations=off"
#
# Reset to the conservative default with:
#     lindos-kernel cmdline reset
# >>> lindos >>>
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT transparent_hugepage=madvise nowatchdog nvme_core.default_ps_max_latency_us=0"
# <<< lindos <<<
