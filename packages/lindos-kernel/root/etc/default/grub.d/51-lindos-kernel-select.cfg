# 51-lindos-kernel-select.cfg — Secure-Boot-aware default kernel selection (SPEC-WINDOWS §31.3).
#
# Sourced by update-grub through /etc/default/grub.d/, right after 50-lindos.cfg (cmdline
# flags).  It sets ONLY `GRUB_DEFAULT`.  The region between the two markers below is rewritten
# idempotently by `lindos-kernel secureboot apply-selection` (grub.py:
# apply_kernel_selection/set_kernel_select): edit freely OUTSIDE the markers; anything you put
# INSIDE them is overwritten.
#
# Policy (binding): the Lindos kernel is allowed to be the default boot entry only when Secure
# Boot is off, or the installed Lindos kernel image is itself signed with the enrolled Machine
# Owner Key (MOK).  Otherwise this drop-in points GRUB_DEFAULT at a kernel entry shim/firmware
# will actually boot, so turning Secure Boot on for a Windows game never leaves the machine
# stuck at a Secure Boot violation screen with no obvious way back in — see docs/KERNEL.md.
#
# `0` (below) is GRUB's own default meaning: boot the newest installed kernel.  It is a
# deliberate, explicit no-op on a fresh install (no Secure Boot restriction yet applies), kept
# here rather than left unset so the current decision is always visible and auditable.  Check
# the live decision at any time with:
#     lindos-kernel secureboot status
# Re-apply it (e.g. after enrolling a MOK, or after installing a new kernel) with:
#     lindos-kernel secureboot apply-selection
# then run the privileged follow-up it prints (`pkexec update-grub`).
# >>> lindos >>>
GRUB_DEFAULT="0"
# <<< lindos <<<
