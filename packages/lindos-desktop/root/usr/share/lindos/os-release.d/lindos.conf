# Lindos /etc/os-release overrides (SPEC §2).
# KEY=VALUE lines; /usr/libexec/lindos/apply-branding.sh seds each KEY into
# /etc/os-release (replacing the line when present, appending otherwise).
# ID, ID_LIKE, VERSION_CODENAME and UBUNTU_CODENAME are deliberately NOT listed:
# apt sources and Mint tooling rely on them staying "linuxmint"/"ubuntu debian".
# The support/bug/privacy URLs replace the base's own pages that some tools link to (About dialogs, bug reporters).
NAME="Lindos"
# display string only (About boxes, `cat /etc/os-release`); VERSION_ID stays the base's because tools read it
VERSION="1.0 (Aurora)"
PRETTY_NAME="Lindos 1.0 (Aurora)"
HOME_URL="https://lindos.dev"
SUPPORT_URL="https://github.com/hardcoregamingsyle/lindos/issues"
BUG_REPORT_URL="https://github.com/hardcoregamingsyle/lindos/issues"
PRIVACY_POLICY_URL="https://github.com/hardcoregamingsyle/lindos/blob/main/docs/FAQ.md"
LOGO=lindos-logo
LINDOS_VERSION=1.0.0
LINDOS_CODENAME=Aurora
