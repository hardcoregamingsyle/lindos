# Lindos /etc/os-release overrides (SPEC §2).
# KEY=VALUE lines; /usr/libexec/lindos/apply-branding.sh seds each KEY into
# /etc/os-release (replacing the line when present, appending otherwise).
# ID, ID_LIKE, VERSION_CODENAME and UBUNTU_CODENAME are deliberately NOT listed:
# apt sources and Mint tooling rely on them staying "linuxmint"/"ubuntu debian".
NAME="Lindos"
PRETTY_NAME="Lindos 1.0 (Aurora)"
HOME_URL="https://lindos.dev"
LOGO=lindos-logo
LINDOS_VERSION=1.0.0
LINDOS_CODENAME=Aurora
