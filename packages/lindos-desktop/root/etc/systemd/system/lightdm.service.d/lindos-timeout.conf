# lindos-timeout.conf — bound how long lightdm.service is allowed to sit "activating (start)"
# before systemd gives up on it (SPEC §5 / CONTINUATION.md item 2, boot-test run 36319809802).
#
# A CI boot-test found lightdm.service (and, alongside it, plymouth-quit-wait.service) starting
# and then never finishing -- stuck "Starting" for 25+ real minutes under real KVM with 4 vCPUs,
# the display never initialized. Upstream systemd's own shipped lightdm.service carries no
# TimeoutStartSec= at all, so a wedged Xorg/display-manager startup (a bad GPU driver, a stuck
# modeset, a greeter that never comes up -- all things that can also happen on real hardware, not
# just under QEMU) hangs the boot forever with no operator-visible failure. graphical.target only
# *Wants* (not Requires) display-manager.service, so lightdm timing out and failing here does not
# fail the whole boot -- systemd still reaches graphical.target/is-system-running=degraded, a
# text-mode login remains usable, and (in CI) our own systemd.run= smoke-test/desktop-watch unit
# -- which was otherwise never running at all because it is ordered after default.target settling
# -- finally gets to run and report real diagnostics instead of the whole harness timing out with
# nothing but silence in serial.log.
#
# lindos-desktop owns the desktop experience, so it ships this itself rather than relying on
# upstream lightdm packaging to ever add one.
[Service]
TimeoutStartSec=90s
