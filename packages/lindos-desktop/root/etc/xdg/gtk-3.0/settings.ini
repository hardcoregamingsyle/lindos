[Settings]
# Lindos GTK 3 defaults (SPEC §5). xfsettingsd (xsettings.xml) overrides these inside an
# XFCE session; this file covers the greeter, TTY-launched apps and other sessions.
gtk-application-prefer-dark-theme=1
gtk-theme-name=Lindos-Dark
gtk-icon-theme-name=Lindos
gtk-fallback-icon-theme=Adwaita
gtk-cursor-theme-name=Fluent-dark-cursors
gtk-cursor-theme-size=24
gtk-font-name=Selawik 10
gtk-decoration-layout=menu:minimize,maximize,close
gtk-dialogs-use-header=0
gtk-enable-animations=1
gtk-overlay-scrolling=1
gtk-primary-button-warps-slider=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-menu-images=1
gtk-button-images=0
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
