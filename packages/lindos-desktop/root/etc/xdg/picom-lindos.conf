# /etc/xdg/picom-lindos.conf — Lindos compositor profile for picom (>= 10), SPEC §5.
#
# Started by `lindos-compositor start` (autostart lindos-picom.desktop); skipped in Lite
# mode and when there is no GLX.  Windows-11 feel: 8 px rounded window corners, soft
# shadows, very short fades, tear-free (vsync), no blur (RAM/GPU budget).  Fullscreen
# windows (games) are unredirected so picom costs nothing while playing.
# Per-user override: ~/.config/lindos/picom.conf (used instead of this file if present).

# --- backend ---------------------------------------------------------------------------
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
xrender-sync-fence = true;
unredir-if-possible = true;
unredir-if-possible-delay = 0;
unredir-if-possible-exclude = [];
detect-transient = true;
detect-client-leader = true;
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
log-level = "warn";

# --- rounded corners (8 px like Windows 11) --------------------------------------------
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfdesktop'",
  "class_g = 'Xfdesktop'",
  "class_g = 'xfce4-notifyd'",
  "class_g = 'Xfce4-notifyd'",
  "class_g = 'Conky'",
  "class_g = 'Plank'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- shadows ---------------------------------------------------------------------------
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -8;
shadow-color = "#000000";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfdesktop'",
  "class_g = 'Xfdesktop'",
  "class_g = 'xfce4-screenshooter'",
  "class_g = 'Xfce4-screenshooter'",
  "class_g = 'Xfwm4'",
  "class_g = 'Wine'",
  "class_g = 'steam_app_*'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "window_type = 'utility'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "bounding_shaped && !rounded_corners"
];

# --- fading (SPEC: fade 0.03) ----------------------------------------------------------
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;
no-fading-openclose = false;
no-fading-destroyed-argb = true;
fade-exclude = [
  "class_g = 'xfce4-panel'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'xfdesktop'",
  "class_g = 'Xfdesktop'",
  "class_g = 'Xfwm4'"
];

# --- opacity ---------------------------------------------------------------------------
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
inactive-dim = 0.0;
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'xfce4-panel'",
  "class_g = 'Xfce4-panel'",
  "class_g = 'Xfwm4'",
  "class_g = 'Wine'"
];
opacity-rule = [];

# --- blur: OFF by default (RAM/GPU budget; enable in ~/.config/lindos/picom.conf) --------
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;
blur-method = "none";
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- per window type -------------------------------------------------------------------
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.96; focus = true; full-shadow = false; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 1.0; shadow = true; };
  dropdown_menu = { opacity = 1.0; shadow = true; };
  utility       = { shadow = false; };
  notification  = { shadow = true; fade = true; };
  desktop       = { shadow = false; blur-background = false; };
};
