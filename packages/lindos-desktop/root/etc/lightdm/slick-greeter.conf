# /etc/lightdm/slick-greeter.conf — Lindos login screen (SPEC §2/§5).
# Windows-11-like: dark aurora wallpaper, Lindos-Dark theme, Selawik font, clock,
# no user-specific background (consistent look), keyboard/a11y/power buttons shown.
[Greeter]
background=/usr/share/backgrounds/lindos/aurora-dark.svg
background-color=#202020
draw-user-backgrounds=false
draw-grid=false
show-hostname=false
show-a11y=true
show-keyboard=true
show-power=true
show-clock=true
clock-format=%H:%M
theme-name=Lindos-Dark
icon-theme-name=Lindos
font-name=Selawik 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
xft-dpi=96
cursor-theme-name=Fluent-dark-cursors
cursor-theme-size=24
logo=/usr/share/pixmaps/lindos-logo.svg
other-monitors-logo=/usr/share/pixmaps/lindos-logo.svg
enable-hidpi=auto
activate-numlock=true
