# /etc/lightdm/lightdm.conf.d/50-lindos.conf — LightDM defaults for Lindos (SPEC §5).
# slick-greeter, users listed (greeter-hide-users=false), no per-user backgrounds,
# XFCE session, guest disabled (RAM + security), user switching allowed.
[Seat:*]
greeter-session=slick-greeter
greeter-hide-users=false
greeter-show-manual-login=false
greeter-allow-guest=false
allow-guest=false
user-session=xfce
session-wrapper=/etc/X11/Xsession
xserver-allow-tcp=false
allow-user-switching=true
