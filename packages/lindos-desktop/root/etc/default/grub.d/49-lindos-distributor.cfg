# /etc/default/grub.d/49-lindos-distributor.cfg - the boot menu says Lindos (update-grub sources this after
# /etc/default/grub).  Only the display name changes: the distribution ID in /etc/lsb-release stays
# "LinuxMint" on purpose, because the installer and Mint's tools recognise the system by it.
GRUB_DISTRIBUTOR="Lindos"
