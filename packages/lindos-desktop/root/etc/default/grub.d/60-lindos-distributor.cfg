# /etc/default/grub.d/60-lindos-distributor.cfg - the boot menu says Lindos.  update-grub sources every *.cfg here in
# name order after /etc/default/grub; Mint ships 50_linuxmint.cfg (GRUB_DISTRIBUTOR=Ubuntu), so this drop-in has to
# sort after it (the old 49- name lost) to win.  The titles seen at boot are additionally rewritten by
# ubuntu-system-adjustments from GRUB_TITLE in /etc/linuxmint/info, which the branding sweep sets to the Lindos title.
# Only the display name changes: the distribution ID in /etc/lsb-release stays "LinuxMint" on purpose.
GRUB_DISTRIBUTOR="Lindos"
