<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Lindos UI font aliases (SPEC §2/§5).

  * "Segoe UI" (requested by Windows apps under Wine, web pages, Electron apps) resolves to
    Selawik — Microsoft's OFL font that is metric-compatible with Segoe UI — then Inter and
    Noto Sans.  Selawik/Inter are installed by build/fetch-assets.sh into
    /usr/share/fonts/truetype/{selawik,inter}; without them the alias simply falls through.
  * The generic families prefer Selawik / Inter (sans-serif), JetBrains Mono → DejaVu Sans
    Mono (monospace) and Noto Serif (serif); emoji from Noto Color Emoji.
  * Segoe UI Symbol / Segoe MDL2 / Fluent icon fonts fall back to Symbols Nerd Font / Noto
    Sans Symbols so glyph boxes are avoided in Windows apps.
-->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer>
      <family>Selawik</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Semibold</family>
    <prefer>
      <family>Selawik Semibold</family>
      <family>Selawik</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Light</family>
    <prefer>
      <family>Selawik Light</family>
      <family>Selawik</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Semilight</family>
    <prefer>
      <family>Selawik Semilight</family>
      <family>Selawik</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Variable</family>
    <prefer>
      <family>Selawik</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Symbol</family>
    <prefer>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols2</family>
      <family>Symbols Nerd Font</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe MDL2 Assets</family>
    <prefer>
      <family>Segoe Fluent Icons</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Sans Symbols2</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Cascadia Mono</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Cascadia Code</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- generic families -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Selawik</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Selawik</family>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Windows-like rendering: slight hinting, sub-pixel RGB, no autohint on Selawik -->
  <match target="font">
    <test name="family" compare="eq">
      <string>Selawik</string>
    </test>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
