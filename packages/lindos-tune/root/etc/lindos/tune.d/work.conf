# /etc/lindos/tune.d/work.conf — Lindos "Work" mode overrides for lindos-tune (SPEC §3, §11)
# KEY=VALUE, shell style.  Precedence: built-in defaults < mode.json < this file.

ZRAM_PERCENT=50
# schedutil → power-profiles-daemon "balanced" when present (SPEC §3: Work = PPD balanced)
GOVERNOR=schedutil
EARLYOOM_MIN=4
COMPOSITOR=picom
ANANICY=off
# no scx scheduler for productivity — the mainline EEVDF scheduler is the right default (SPEC-KERNEL §16)
sched=none
# transparent hugepages: madvise | always | never
thp=madvise
# mglru=on
# EARLYOOM_SWAP_MIN=100
# SWAPPINESS=180
