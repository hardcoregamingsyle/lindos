# /etc/lindos/tune.d/gaming.conf — Lindos "Gaming" mode overrides for lindos-tune (SPEC §3, §11)
# KEY=VALUE, shell style.  Precedence: built-in defaults < mode.json < this file.

# 75 % zram: big headroom for games + browser + launcher without touching the disk
ZRAM_PERCENT=75
# max clocks; power-profiles-daemon "performance" when present, else sysfs + intel/amd_pstate EPP
GOVERNOR=performance
EARLYOOM_MIN=4
# picom stays on; gamemode pauses it while a game runs (/etc/gamemode.ini → lindos-compositor stop)
COMPOSITOR=picom
# ananicy-cpp: games high priority, browsers normal, compilers idle (/etc/ananicy.d/lindos)
ANANICY=on
# scx_lavd (Latency-Aware Virtual Deadline): the low-latency gaming scheduler (SPEC-KERNEL §16)
# needs the lindos-kernel; degrades to a logged skip on a kernel without sched_ext
sched=scx_lavd
# transparent hugepages: madvise keeps games' large allocations fast without bloating idle RAM
thp=madvise
# mglru=on
# vm.max_map_count=2147483642 comes from mode.json "sysctl" (90-lindos-mode.conf)
# EARLYOOM_SWAP_MIN=100
# SWAPPINESS=180
