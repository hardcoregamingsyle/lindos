# /etc/lindos/tune.d/creator.conf — Lindos "Creator" mode overrides for lindos-tune (SPEC §3, §11)
# KEY=VALUE, shell style.  Precedence: built-in defaults < mode.json < this file.

# Wine/Bottles creative apps like RAM headroom; keep the default 50 % zram (raise on ≤ 8 GB boxes)
ZRAM_PERCENT=50
GOVERNOR=schedutil
EARLYOOM_MIN=4
COMPOSITOR=picom
ANANICY=off
# scx_bpfland: interactive-workload scheduler — keeps creative apps responsive under load (SPEC-KERNEL §16)
# needs the lindos-kernel; degrades to a logged skip on a kernel without sched_ext
sched=scx_bpfland
# transparent hugepages: madvise | always | never
thp=madvise
# mglru=on
# EARLYOOM_SWAP_MIN=100
# SWAPPINESS=180
