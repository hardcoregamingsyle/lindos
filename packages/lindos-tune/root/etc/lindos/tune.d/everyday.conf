# /etc/lindos/tune.d/everyday.conf — Lindos "Everyday" mode overrides for lindos-tune (SPEC §3, §11)
# KEY=VALUE, shell style.  Precedence: built-in defaults < mode.json < this file.
# Edit here to tune a machine without touching /usr/share/lindos/modes.

# zram size as % of RAM (0 disables zram; zram-generator or zram-tools required)
ZRAM_PERCENT=50
# cpufreq governor: schedutil | performance | powersave | ondemand | conservative
GOVERNOR=schedutil
# earlyoom acts when free RAM drops below this % (-m)
EARLYOOM_MIN=4
# compositor hint for the session (picom | xfwm | none) — applied per user by lindos-mode
COMPOSITOR=picom
# ananicy-cpp process priorities (on = enable ananicy-cpp.service when installed)
ANANICY=off
# sched_ext scheduler (SPEC-KERNEL §16): scx_lavd | scx_bpfland | scx_flash | scx_rustland | none
# (needs the lindos-kernel; degrades to a logged skip on a kernel without sched_ext)
sched=none
# transparent hugepages: madvise | always | never  (/sys/kernel/mm/transparent_hugepage/enabled)
thp=madvise
# MGLRU (multi-gen LRU): on | off  (leave unset to keep the kernel default)
# mglru=on
# Optional extras (uncomment to override):
# EARLYOOM_SWAP_MIN=100      # earlyoom -s
# SWAPPINESS=180             # vm.swappiness (default: 180 with zram, 60 without)
# SERVICES_DISABLE="bluetooth.service ModemManager.service"   # whitelisted units only
# SERVICES_ENABLE=""
