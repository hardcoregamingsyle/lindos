# /etc/lindos/tune.d/lite.conf — Lindos "Lite" mode overrides for lindos-tune (SPEC §3, §11)
# KEY=VALUE, shell style.  Precedence: built-in defaults < mode.json < this file.
# Target: ≤ 4 GB RAM / old PCs, idle ≈ 300–380 MB (estimate until measured).

# 100 % zram: on a 2–4 GB machine compressed swap in RAM is what keeps the desktop responsive
ZRAM_PERCENT=100
GOVERNOR=schedutil
# earlyoom is aggressive in Lite: act below 8 % free RAM instead of 4 %
EARLYOOM_MIN=8
# no picom, no xfwm compositing (lindos-compositor honours this in the session)
COMPOSITOR=none
ANANICY=off
# no scx scheduler on low-RAM boxes; keep the mainline scheduler (SPEC-KERNEL §16)
sched=none
# transparent hugepages: madvise | always | never
thp=madvise
# MGLRU on: better page reclaim under memory pressure is exactly what a 2–4 GB box needs
mglru=on
# extra idle-RAM savers: bluetooth + ModemManager + cups-browsed off (printing via cups.socket stays)
SERVICES_DISABLE="bluetooth.service ModemManager.service cups-browsed.service"
# EARLYOOM_SWAP_MIN=100
# SWAPPINESS=180
