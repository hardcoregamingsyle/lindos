# /etc/tmpfiles.d/lindos.conf — directories used by the Lindos tuning tools (lindos-tune)
# Type Path                 Mode User Group Age Argument
d /var/log/lindos           0755 root root  -
d /var/lib/lindos-tune      0755 root root  -
# The CPU governor / EPP persistence line lives in /etc/tmpfiles.d/lindos-governor.conf
# (written by `lindos-tune governor <g>` / `lindos-tune apply` when power-profiles-daemon is absent).
