<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Lindos Transfer">
  <defs>
    <linearGradient id="lindos-transfer-arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60CDFF"/>
      <stop offset="1" stop-color="#0067C0"/>
    </linearGradient>
  </defs>
  <!-- source: a plain folder, standing in for "your old files" -->
  <path d="M4 16 h14 l4 5 h20 a3 3 0 0 1 3 3 v20 a3 3 0 0 1 -3 3 H7 a3 3 0 0 1 -3 -3 V19 a3 3 0 0 1 3 -3 z"
        fill="#3A3A3A" stroke="#2B2B2B" stroke-width="1.5"/>
  <path d="M4 22 h41 a3 3 0 0 1 3 3 v18 a3 3 0 0 1 -3 3 H7 a3 3 0 0 1 -3 -3 V22 z" fill="#4A4A4A"/>
  <!-- destination: a rounded Lindos square -->
  <rect x="40" y="30" width="20" height="20" rx="5" fill="#0067C0"/>
  <path d="M46 44 v-9 l4 4 4-4 v9 z" fill="#FFFFFF"/>
  <!-- the transfer itself: an arrow in the Lindos accent, crossing from folder to square -->
  <path d="M22 33 h16 l-4.5 -4.5 a2 2 0 1 1 2.8 -2.8 l8.3 8.3 a2 2 0 0 1 0 2.8 l-8.3 8.3 a2 2 0 1 1 -2.8 -2.8 l4.5 -4.5 h-16 a2 2 0 0 1 0 -4 z"
        fill="url(#lindos-transfer-arrow)"/>
</svg>
