# Lindos live/installer GRUB menu — copied onto the ISO root by
# build/build-iso.sh from build/overlay/ (the @-delimited tokens below are
# filled in from build/config.env at that point).  Serves BIOS (eltorito.img) and
# UEFI (the GRUB in the appended EFI partition loads /boot/grub/grub.cfg from
# the ISO after locating it through /.disk/info).  The BIOS menu (isolinux/live.cfg)
# is generated from the entries below by build/lib/boot_menu.py, so both boot paths
# always offer the same choices.
#
# The installation flow (docs: CONTINUATION.md / docs/BUILDING.md "Installer flow"):
#   * "Install Lindos" boots straight into the installer and nothing else (only-ubiquity: no
#     desktop, no first-run wizard, nothing to install or configure in the live system);
#   * oem-config/enable=true puts Ubiquity in OEM mode: the installer does the heavy work
#     (updates, drivers, Chrome, apps) and the FIRST BOOT of the new system asks for the
#     account name, password and computer name (oem-config) - not the installer again;
#   * ubiquity/success_command runs the short finalisation that arms that first-boot wizard;
#   * "Try Lindos" is the live desktop; its desktop launcher "Install Lindos" follows the same
#     OEM flow because oem-config/enable=true is on this entry too.
# Kernel/initrd names follow the Mint casper layout (/casper/vmlinuz,
# /casper/initrd.lz); build-iso.sh rewrites the initrd name if the base ISO
# uses plain "initrd".  Keep 'boot=casper' and 'quiet splash' — casper (the
# live-boot system) needs the former, plymouth the latter.  @PRESEED@ becomes
# 'file=/cdrom/preseed/<seed> ' when the base ISO ships a seed, or nothing (the
# Mint 22.2 ISO has none).  Values on the kernel command line cannot contain spaces.
# ${iso_path} is set by loopback.cfg-style loaders (Ventoy/grml) so the same
# entries also work when the ISO is loop-booted from a hard disk.

if loadfont /boot/grub/font.pf2 ; then
	set gfxmode=auto
	insmod efi_gop
	insmod efi_uga
	insmod gfxterm
	terminal_output gfxterm
fi

# Theme note: a plain gfxterm palette in Lindos colours (dark #202020
# background, light-blue highlight).  No background image is required, so
# the menu renders identically on BIOS and UEFI firmware.  A full graphical
# theme can be added later as /boot/grub/theme.txt + 'set theme=…'.
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
set color_normal=light-gray/black
set color_highlight=black/light-cyan
if [ x"$feature_all_video_module" = xy ] ; then
	background_color 32,32,32
fi

set default=0
set timeout=10
set timeout_style=menu

menuentry "Install Lindos @LINDOS_VERSION_SHORT@" --class lindos --class gnu-linux --class os {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper only-ubiquity oem-config/enable=true ubiquity/success_command=/usr/libexec/lindos/installer/finalize.sh username=liveuser hostname=lindos iso-scan/filename=${iso_path} quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "Install Lindos @LINDOS_VERSION_SHORT@ (compatibility mode)" --class lindos --class gnu-linux --class os {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper only-ubiquity oem-config/enable=true ubiquity/success_command=/usr/libexec/lindos/installer/finalize.sh username=liveuser hostname=lindos iso-scan/filename=${iso_path} nomodeset quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "Try Lindos @LINDOS_VERSION_SHORT@ (live session)" --class lindos --class gnu-linux --class os {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper oem-config/enable=true ubiquity/success_command=/usr/libexec/lindos/installer/finalize.sh username=liveuser hostname=lindos iso-scan/filename=${iso_path} quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "Try Lindos @LINDOS_VERSION_SHORT@ (compatibility mode)" --class lindos --class gnu-linux --class os {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper oem-config/enable=true ubiquity/success_command=/usr/libexec/lindos/installer/finalize.sh username=liveuser hostname=lindos iso-scan/filename=${iso_path} nomodeset quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "Check the integrity of the medium" --class lindos --class gnu-linux --class os {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper oem-config/enable=true ubiquity/success_command=/usr/libexec/lindos/installer/finalize.sh username=liveuser hostname=lindos iso-scan/filename=${iso_path} integrity-check quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "Boot from the first hard disk" --class os {
	if [ x"$grub_platform" = xefi ] ; then
		# Hand control back to the firmware, which continues with its next
		# boot entry (chain-loading by path could pick this very medium).
		exit
	else
		insmod part_gpt
		insmod part_msdos
		insmod chain
		set root=(hd0)
		chainloader +1
	fi
}
if [ -f /boot/grub/memtest.cfg ] ; then
	source /boot/grub/memtest.cfg
fi
