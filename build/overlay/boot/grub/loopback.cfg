# Lindos loopback.cfg — used when the ISO file is loop-mounted by another
# GRUB (grml/Ventoy "loopback" boot).  ${iso_path} is set by that loader and
# passed to casper as iso-scan/filename= so it can find the ISO on the disk.
# Same entries as grub.cfg minus the video/theme setup.
menuentry "Start Lindos @LINDOS_VERSION_SHORT@" --class lindos {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper username=mint hostname=mint iso-scan/filename=${iso_path} quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "Start Lindos @LINDOS_VERSION_SHORT@ (compatibility mode)" --class lindos {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper username=mint hostname=mint iso-scan/filename=${iso_path} nomodeset quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "OEM install (for manufacturers)" --class lindos {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper username=mint hostname=mint iso-scan/filename=${iso_path} oem-config/enable=true only-ubiquity quiet splash --
	initrd	/casper/initrd.lz
}
menuentry "Check the integrity of the medium" --class lindos {
	set gfxpayload=keep
	linux	/casper/vmlinuz  @PRESEED@boot=casper username=mint hostname=mint iso-scan/filename=${iso_path} integrity-check quiet splash --
	initrd	/casper/initrd.lz
}
