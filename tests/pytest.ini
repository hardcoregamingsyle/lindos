; Lindos pytest configuration.
;
; Invoked by tests/run.sh as:
;   python -m pytest -q -c tests/pytest.ini --rootdir . -p lindos_testsupport \
;          tests packages/*/tests build/tests
;
; `pythonpath` is resolved relative to the rootdir.  It lists both "." and
; "tests" so that tests/ ends up on sys.path whether rootdir is the repository
; root (run.sh passes --rootdir .) or the tests/ directory (bare
; `pytest -c tests/pytest.ini`).
;
; --import-mode=importlib avoids "import file mismatch" errors when several
; packages/<name>/tests/ directories contain files with the same basename
; (test_config.py, conftest.py, ...).

[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
addopts = -ra --strict-markers --import-mode=importlib
pythonpath = . tests
markers =
    linux: test needs a Linux host (skipped elsewhere)
    slow: slow test (network/heavy)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
